name: Reproducible bug
description: Report a fixture or portability problem with fictional data
title: "[bug] "
body:
  - type: textarea
    id: command
    attributes:
      label: Minimal command and scenario
      description: Include tool version, Node, Git and operating system. Omit private paths.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
      description: Share the smallest relevant JSON finding, with fictional data.
    validations:
      required: true
